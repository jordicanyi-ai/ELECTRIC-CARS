name: Prepare ranking thumbnails (review only)
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Optional model slug; empty processes all reviewed sources'
        required: false
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ranking-thumbnails.txt
      - run: pip install -r requirements-ranking-thumbnails.txt
      - name: Generate transparent WebP previews
        env:
          MODEL_SLUG: ${{ inputs.model }}
        run: |
          if [ -n "$MODEL_SLUG" ]; then
            python scripts/prepare-ranking-thumbnails.py --model "$MODEL_SLUG"
          else
            python scripts/prepare-ranking-thumbnails.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ranking-thumbnails-review
          path: tmp/ranking-thumbnails-review/
          if-no-files-found: error
          retention-days: 14
