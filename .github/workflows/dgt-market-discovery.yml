name: DGT monthly market data archive discovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dgt-market-discovery.yml'
      - 'scripts/market/inspect_dgt_zip.py'
      - 'scripts/market/validate_dgt_records.py'
  schedule:
    - cron: '23 7 1-5 * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test DGT discovery and fail-safe behavior
        run: python -m unittest discover -s scripts/market -p 'test_*.py' -v
      - name: Validate official DGT monthly archive links
        run: python scripts/market/dgt_archive_index.py
      - name: Inspect official DGT September 2026 archive format
        run: python scripts/market/inspect_dgt_zip.py --url https://www.dgt.es/microdatos/salida/2026/9/vehiculos/matriculaciones/export_mensual_mat_202609.zip
      - name: Print non-personal DGT record layout summary
        run: python -c 'import json; d=json.load(open("data/market/dgt-format-report.json")); print(json.dumps(d, indent=2))'
      - name: Validate full DGT monthly record widths
        run: python scripts/market/validate_dgt_records.py --url https://www.dgt.es/microdatos/salida/2026/9/vehiculos/matriculaciones/export_mensual_mat_202609.zip
      - name: Preserve result as reviewable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgt-archive-index
          path: |
            data/market/dgt-archive-index.json
            data/market/dgt-format-report.json
            data/market/dgt-layout-validation.json
          retention-days: 30
