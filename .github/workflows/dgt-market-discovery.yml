name: DGT monthly market data archive discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 1-5 * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test DGT discovery and fail-safe behavior
        run: python -m unittest discover -s scripts/market -p 'test_*.py' -v
      - name: Validate official DGT monthly archive links
        run: python scripts/market/dgt_archive_index.py
      - name: Preserve result as reviewable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgt-archive-index
          path: data/market/dgt-archive-index.json
          retention-days: 30
