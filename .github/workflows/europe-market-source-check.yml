name: European BEV data staging (no publication)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  stage-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official Ember CSV
        run: python3 scripts/europe-market/download.py
      - name: Validate monthly BEV country registrations
        run: python3 scripts/europe-market/validate.py reports/ember-monthly-ev-sales.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-bev-staging
          path: |
            reports/europe-market-preview.json
            reports/ember-monthly-ev-sales.csv
          if-no-files-found: warn
          retention-days: 30
