name: European BEV source check (no publication)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Ember source freshness
        run: python3 scripts/europe-market/check_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-market-source-check
          path: reports/europe-market-source-check.json
          if-no-files-found: warn
          retention-days: 90
