<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · electricos.eu</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172b43}header{padding:22px max(20px,calc((100vw - 1050px)/2));background:#fff;border-bottom:1px solid #ddd}main{max-width:1050px;margin:32px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe3ee;border-radius:15px;padding:24px;margin:16px 0}input{font:inherit;padding:10px;border:1px solid #bbc7d5;border-radius:8px;width:100%;max-width:420px}label{display:block;margin:14px 0 6px;font-weight:600}button{background:#1767c7;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;margin:5px 8px 5px 0}button.secondary{background:#e7edf5;color:#172b43}button.danger{background:#a82f42}button:disabled{opacity:.5}h1{font-size:26px}h2{font-size:20px}.muted{color:#66778c}.hidden{display:none!important}.error{color:#aa2534}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid #ddd}</style></head><body><header><strong>electricos.eu</strong> / Administración · Pruebas</header><main><h1>Moderación de anuncios</h1><p class="muted">Acceso exclusivo a administradores autorizados.</p><section id="login" class="panel"><h2>Acceso</h2><form id="login-form"><label for="email">Correo</label><input id="email" type="email" required autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"><p><button>Entrar</button></p></form></section><p id="message" role="status"></p><section id="dashboard" class="hidden"><button class="secondary" id="logout">Cerrar sesión</button><button id="refresh" class="secondary">Actualizar anuncios</button><div id="listings"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="data/cars.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id),db=window.supabase.createClient('https://ugaronecjpywrvtlzcni.supabase.co','sb_publishable_awWi9XNEDdFLg1z8uQqeYQ_2Jt-Twaj');function msg(t,bad=false){$('message').textContent=t;$('message').className=bad?'error':'muted'}function logoutUI(){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('listings').replaceChildren()}async function start(){const {data:{user}}=await db.auth.getUser();if(!user){logoutUI();return}const {data,error}=await db.from('site_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){logoutUI();msg(error?error.message:'Esta cuenta no tiene permisos de administrador.',true);return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}async function load(){const {data,error}=await db.from('vehicle_listings').select('id,model_id,price_eur,status,year,mileage_km,city,description,dealer_id,created_at').in('status',['pending','rejected','published']).order('created_at',{ascending:false}).limit(100);const list=$('listings');list.replaceChildren();if(error){msg(error.message,true);return}if(!data?.length){list.textContent='No hay anuncios pendientes ni moderados.';return}for(const item of data){const c=(typeof carsData!=='undefined'?carsData:[]).find(x=>x.id===item.model_id);const box=document.createElement('article');box.className='panel';const h=document.createElement('h2');h.textContent=(c?c.brand+' '+c.model:'Modelo '+item.model_id)+' · '+Number(item.price_eur).toLocaleString('es-ES')+' €';box.append(h);const p=document.createElement('p');p.textContent='Estado: '+item.status+' · '+item.year+' · '+item.mileage_km+' km · '+item.city;box.append(p);const d=document.createElement('p');d.textContent=item.description||'';box.append(d);const gallery=document.createElement('div');gallery.className='photos';box.append(gallery);const {data:photos,error:photoError}=await db.from('vehicle_photos').select('storage_path,position').eq('listing_id',item.id).order('position');if(photoError){const e=document.createElement('p');e.textContent='Fotos: '+photoError.message;box.append(e)}else for(const photo of photos||[]){const {data:signed}=await db.storage.from('dealer-vehicles').createSignedUrl(photo.storage_path,120);if(signed?.signedUrl){const a=document.createElement('a');a.href=signed.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=signed.signedUrl;img.alt='Foto del vehículo';a.append(img);gallery.append(a)}}if(item.status==='pending'){for(const [decision,label,klass] of [['approve','Aprobar',''],['reject','Rechazar','danger']]){const b=document.createElement('button');b.textContent=label;b.className=klass;b.onclick=async()=>{if(!confirm('¿'+label+' este anuncio?'))return;b.disabled=true;const {error}=await db.rpc('moderate_vehicle_listing',{target_id:item.id,decision});msg(error?error.message:'Anuncio '+(decision==='approve'?'aprobado':'rechazado')+'.',!!error);await load()};box.append(b)}}list.append(box)}}$('login-form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){msg(error.message,true);return}await start()};$('logout').onclick=async()=>{await db.auth.signOut();logoutUI();msg('Sesión cerrada')};$('refresh').onclick=load;start().catch(e=>msg(e.message,true));})();</script></body></html>
