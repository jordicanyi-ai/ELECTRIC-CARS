<main class="brands-main"><h1>MARCAS DE COCHES ELÉCTRICOS</h1><p class="lead">Explora los fabricantes y descubre sus modelos en nuestro comparador independiente.</p>

<p id="brands-count" aria-live="polite"></p><div id="brands-grid" class="brands-grid"></div></main>
<script src="/data/cars.js"></script><script>
const counts=new Map();
for(const car of carsData){if(!car.brand || !Array.isArray(car.images) || !car.images.length)continue;const key=car.brand.trim();const prev=counts.get(key)||{count:0,logo:""};prev.count++;if(!prev.logo && car.brandInfo && car.brandInfo.logo)prev.logo=car.brandInfo.logo;counts.set(key,prev)}
const names=[...counts.keys()].sort((a,b)=>a.localeCompare(b,"es"));
const grid=document.getElementById("brands-grid"),input=document.getElementById("brands-search"),counter=document.getElementById("brands-count");
function renderBrands(){const q=input.value.toLocaleLowerCase("es").trim();const visible=names.filter(name=>name.toLocaleLowerCase("es").includes(q));grid.replaceChildren();for(const name of visible){const info=counts.get(name),a=document.createElement("a");a.className="brand-card";a.dataset.brand=name.toLocaleLowerCase("es");const profiles={"audi":"audi","bmw":"bmw","byd":"byd","cupra":"cupra","citroën":"citroen","dacia":"dacia","denza":"denza","fiat":"fiat","ford":"ford","geely":"geely","hyundai":"hyundai","kia":"kia","lancia":"lancia","leapmotor":"leapmotor","mg":"mg","mini":"mini","nissan":"nissan","opel":"opel","peugeot":"peugeot","renault":"renault","suzuki":"suzuki","tesla":"tesla","toyota":"toyota","volkswagen":"volkswagen","volvo":"volvo","xpeng":"xpeng","smart":"smart","škoda":"skoda"};const slug=profiles[name.toLocaleLowerCase("es")];a.href=slug?"/marcas/"+slug+"/":"/comparador/?marca="+encodeURIComponent(name)+"#page-title";{const slot=document.createElement("div");slot.className="brand-logo-slot";const fallback=document.createElement("span");fallback.className="brand-logo-fallback";fallback.textContent=name.toUpperCase();if(info.logo){const img=document.createElement("img");img.src=/^https?:\/\//i.test(info.logo)?info.logo:(info.logo.startsWith("/")?info.logo:"/"+info.logo);img.alt="Logo "+name;img.loading="lazy";img.onerror=()=>{img.remove();slot.append(fallback)};slot.append(img)}else slot.append(fallback);a.append(slot)}const strong=document.createElement("strong");strong.textContent=name.toLocaleUpperCase("es");const small=document.createElement("small");small.textContent=info.count+" "+(info.count===1?"modelo":"modelos");a.append(strong,small);grid.append(a)}counter.textContent=visible.length+" marcas"}
input.addEventListener("input",renderBrands);renderBrands();
</script></body></html>
