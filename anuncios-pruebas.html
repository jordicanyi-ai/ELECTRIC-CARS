<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vista previa de anuncios · electricos.eu</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#172b43;margin:0}header{background:#fff;padding:20px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid #dbe3ee}main{max-width:1100px;margin:32px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe3ee;border-radius:16px;padding:24px;margin-bottom:22px}h1{font-size:26px}h2{font-size:23px}.muted{color:#61748b}.error{color:#aa2534}.hidden{display:none!important}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin:16px 0}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:22px}.contact{border:1px solid #dbe3ee;border-radius:12px;padding:18px;background:#f8fafc;align-self:start}a.btn,button{display:inline-block;padding:11px 16px;border:0;border-radius:9px;background:#1767c7;color:white;text-decoration:none;cursor:pointer;font:inherit;margin:5px 5px 5px 0}input{padding:10px;border:1px solid #bbc7d5;border-radius:8px;font:inherit;max-width:100%;display:block;margin:8px 0}a{color:#1767c7}address{font-style:normal;line-height:1.6;white-space:pre-line}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style></head><body><header><strong>electricos.eu</strong> / Vista previa de anuncios · Pruebas</header><main><h1>Vehículos aprobados</h1><p class="muted">Página de pruebas privada, no enlazada desde el comparador. Solo muestra anuncios publicados.</p><section id="login" class="panel"><h2>Acceso de pruebas</h2><form id="login-form"><label>Correo<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="content" class="hidden"><button id="logout">Cerrar sesión</button><div id="listings"></div></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="data/cars.js"></script><script>(async function(){'use strict';const $=id=>document.getElementById(id),db=window.supabase.createClient('https://ugaronecjpywrvtlzcni.supabase.co','sb_publishable_awWi9XNEDdFLg1z8uQqeYQ_2Jt-Twaj');function msg(s){$('message').textContent=s}function el(tag,content,cls){const e=document.createElement(tag);if(content!==undefined)e.textContent=content;if(cls)e.className=cls;return e}function detail(parent,label,value){if(value){const p=el('p');p.append(el('strong',label+': '),document.createTextNode(String(value)));parent.append(p)}}function link(parent,label,href,btn=false){const a=el('a',label,btn?'btn':'');a.href=href;a.rel='noopener noreferrer';if(/^https?:/.test(href))a.target='_blank';parent.append(a)}async function load(){const {data:{user}}=await db.auth.getUser();if(!user){$('login').classList.remove('hidden');$('content').classList.add('hidden');return}const [{data:admin},{data:members}]=await Promise.all([db.from('site_admins').select('user_id').eq('user_id',user.id).maybeSingle(),db.from('dealer_members').select('dealer_id').eq('user_id',user.id)]);if(!admin&&!(members||[]).length){msg('Acceso reservado a administradores y concesionarios.');return}$('login').classList.add('hidden');$('content').classList.remove('hidden');const {data,error}=await db.from('vehicle_listings').select('id,dealer_id,model_id,trim_name,condition,year,mileage_km,price_eur,city,province,description,status').eq('status','published').order('created_at',{ascending:false}).limit(50);const root=$('listings');root.replaceChildren();if(error){msg(error.message);return}if(!data?.length){root.append(el('p','Todavía no hay anuncios publicados.'));return}for(const item of data){const c=(typeof carsData!=='undefined'?carsData:[]).find(x=>x.id===item.model_id);const article=el('article',undefined,'panel'),title=el('h2',c?c.brand+' '+c.model:'Modelo '+item.model_id);article.append(title,el('h2',Number(item.price_eur).toLocaleString('es-ES')+' €'));const layout=el('div',undefined,'layout'),left=el('div'),contact=el('aside',undefined,'contact');detail(left,'Año',item.year);detail(left,'Kilómetros',Number(item.mileage_km).toLocaleString('es-ES')+' km');detail(left,'Estado',({new:'Nuevo',demo:'Demostración',used:'Ocasión'})[item.condition]||item.condition);detail(left,'Ubicación',[item.city,item.province].filter(Boolean).join(', '));detail(left,'Versión',item.trim_name);if(item.description)left.append(el('p',item.description));const gallery=el('div',undefined,'gallery');left.append(gallery);const {data:photos,error:photoError}=await db.from('vehicle_photos').select('storage_path,position').eq('listing_id',item.id).order('position');if(photoError)gallery.append(el('p','No se pudieron cargar las fotos.'));else for(const photo of photos||[]){const {data:signed}=await db.storage.from('dealer-vehicles').createSignedUrl(photo.storage_path,300);if(signed?.signedUrl){const a=el('a');a.href=signed.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=el('img');img.src=signed.signedUrl;img.alt='Fotografía del vehículo';a.append(img);gallery.append(a)}}contact.append(el('h3','Concesionario'));const {data:dealer,error:dealerError}=await db.from('dealers').select('name,address,postal_code,city,province,phone,contact_email,website,whatsapp').eq('id',item.dealer_id).maybeSingle();if(dealerError||!dealer){contact.append(el('p','Datos del concesionario no disponibles.'))}else{contact.append(el('h3',dealer.name));const address=[dealer.address,[dealer.postal_code,dealer.city].filter(Boolean).join(' '),dealer.province].filter(Boolean).join('\n');if(address)contact.append(el('address',address));if(dealer.phone)link(contact,'Llamar','tel:'+dealer.phone.replace(/[^+\d]/g,''),true);if(dealer.contact_email)link(contact,'Enviar correo','mailto:'+dealer.contact_email,true);if(dealer.whatsapp)link(contact,'WhatsApp','https://wa.me/'+dealer.whatsapp.replace(/\D/g,''),true);if(dealer.website&&/^https:\/\//i.test(dealer.website))link(contact,'Web del concesionario',dealer.website)}layout.append(left,contact);article.append(layout);root.append(article)}}$('login-form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){msg(error.message);return}msg('');await load()};$('logout').onclick=async()=>{await db.auth.signOut();$('listings').replaceChildren();await load()};await load()})().catch(e=>{document.getElementById('message').textContent=e.message});</script></body></html>
