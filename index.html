<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electricos.eu — Buscador Objetivo de Coches Eléctricos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Cabecera -->
    <header class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-7 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3.5">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg flex items-center justify-center transform hover:scale-105 transition">
                    <i class="fa-solid fa-bolt-lightning text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight">electricos<span class="text-blue-400">.eu</span></h1>
                    <p class="text-xs text-slate-400 font-medium">Comparador independiente de vehículos eléctricos</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="hidden md:flex items-center gap-2 text-xs font-semibold text-slate-300 bg-slate-900 px-4 py-2 rounded-full border border-slate-800 shadow-inner">
                    <i class="fa-solid fa-shield-halved text-blue-400"></i> Datos técnicos neutros y verificados
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Botón Desplegable de Filtros para Móvil -->
        <div class="lg:hidden w-full">
            <button onclick="toggleMobileFilters()" class="w-full bg-white border border-slate-300 py-3.5 px-4 rounded-2xl font-bold text-sm text-slate-800 shadow-sm flex items-center justify-between">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-filter text-blue-600"></i> Filtrar vehículos
                </span>
                <i id="filter-toggle-icon" class="fa-solid fa-chevron-down text-xs text-slate-400 transition"></i>
            </button>
        </div>

        <!-- Panel de Filtros -->
        <aside id="filters-panel" class="hidden lg:block lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs h-fit lg:sticky lg:top-28 space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h2 class="font-bold text-slate-900 flex items-center gap-2 text-sm uppercase tracking-wider">
                    <i class="fa-solid fa-filter text-blue-600"></i> Filtros
                </h2>
                <button onclick="resetFilters()" class="text-xs font-semibold text-slate-400 hover:text-blue-600 transition">Limpiar</button>
            </div>

            <!-- Búsqueda por texto -->
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Marca o Modelo</label>
                <div class="relative">
                    <input type="text" id="search-input" oninput="filterCars()" placeholder="Ej: Leapmotor, Tesla..." class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                </div>
            </div>

            <!-- Filtro por Carrocería -->
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Tipo de Vehículo</label>
                <select id="body-filter" onchange="filterCars()" class="w-full py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition cursor-pointer">
                    <option value="">Todos los tipos</option>
                    <option value="Utilitario">Utilitario / Compacto</option>
                    <option value="SUV">SUV</option>
                    <option value="Sedan">Sedán / Berlina</option>
                </select>
            </div>

            <!-- Filtro por Plazas -->
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Plazas Mínimas</label>
                <select id="seats-filter" onchange="filterCars()" class="w-full py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition cursor-pointer">
                    <option value="">Cualquier plaza</option>
                    <option value="5">5 plazas</option>
                    <option value="7">7 plazas</option>
                </select>
            </div>

            <!-- Autonomía mínima -->
            <div>
                <div class="flex justify-between text-xs font-bold uppercase
